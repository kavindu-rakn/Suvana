name: CI

# Existing module gates plus portability, built-asset and brand checks.
# Docker builds are manual only; no image is pushed or deployed.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sync-guards:
    name: Sync guards — Suvana couplings intact
    runs-on: ubuntu-latest
    # Offline and dependency-free: asserts every Suvana-specific change declared
    # in tools/sync/upstreams.json survived the last re-sync from upstream.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: node tools/sync/sync.mjs guard

  learn:
    name: Learn — tests and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/learn
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: apps/learn/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: Check Suvana dist assets
        run: node ../../tools/ci/check-learn-dist.mjs suvana

  learn-r26:
    name: Learn — standalone R26 build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/learn
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: apps/learn/package-lock.json
      - run: npm ci
      # Isolated checkout: never remove the config from the Suvana build job.
      - run: rm suvana.config.json
      - run: npm run build
      - name: Check standalone dist assets
        run: node ../../tools/ci/check-learn-dist.mjs r26

  brands:
    name: Brand — user-facing source grep
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: apps/learn/package-lock.json
      # Reuse the pinned TypeScript parser; do not run Learn asset generation.
      - run: npm ci --ignore-scripts --prefix apps/learn
      - run: node --test tools/ci/*.test.mjs
      - run: node tools/ci/check-brands.mjs

  docker-build:
    name: Docker — ${{ matrix.service }} (manual)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        service: [recognition, speech]
    steps:
      - uses: actions/checkout@v4
      # Build only. No registry login, model download at startup or image push.
      - run: docker build --tag suvana-${{ matrix.service }}:ci services/${{ matrix.service }}

  shell:
    name: Shell — tests and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/shell
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: apps/shell/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build

  communicate:
    name: Communicate — build and type-check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/communicate
    # `next build` type-checks, and the app reads configuration at module load,
    # so it needs values present. These are deliberately fake: this job proves
    # the code compiles, never that it can reach a database.
    env:
      NEXT_PUBLIC_BASE_PATH: /communicate
      MONGODB_URI: mongodb://127.0.0.1:27017/ci
      NEXTAUTH_SECRET: ci-only-not-a-real-secret
      NGROK_UPDATE_SECRET: ci-only
      CLOUDINARY_CLOUD_NAME: ci
      CLOUDINARY_API_KEY: ci
      CLOUDINARY_API_SECRET: ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: apps/communicate/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  recognition:
    name: Recognition — Python tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/recognition
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      # Only the two suites that are pure NumPy with `requests` mocked. The
      # older tests in this folder import TensorFlow and MediaPipe, which is a
      # multi-GB install for a CI run that would still not have the model.
      - run: pip install numpy requests pytest
      - run: pytest tests/test_keypoint_augmentation.py tests/test_sinhala_labels.py -q

  alerts:
    name: Alerts — type-check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/alerts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: apps/alerts/package-lock.json
      - run: npm ci
      # No build: an Expo native build needs EAS and signing credentials.
      # Type-checking is what CI can honestly assert about this app.
      - run: npx tsc --noEmit
