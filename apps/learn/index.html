<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <!-- viewport-fit=cover lets the bottom tab bar sit under the home indicator
         and pad itself with env(safe-area-inset-bottom). -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0a1414" />
    <meta
      name="description"
      content="Interactive Sri Lankan Sign Language learning and practice for hearing users"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Serif:wght@400;600;700;800&family=Noto+Serif+Sinhala:wght@500;700&display=swap"
      rel="stylesheet"
    />
    <title>Learn — සුවණ Suvana</title>
    <script>
      /* Theme, before first paint — the same block the shell runs. One shared
         localStorage key across every same-origin Suvana surface, falling
         back to the operating system's preference. Inline and synchronous:
         deferring it by a frame is the flash of the wrong theme. */
      (function () {
        try {
          var t = localStorage.getItem('suvana.theme');
          if (t !== 'light' && t !== 'dark') {
            t = window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
          }
          document.documentElement.dataset.theme = t;
        } catch (e) {
          document.documentElement.dataset.theme = 'dark';
        }
      })();
    </script>
  </head>
  <body>
    <!-- Scroll Progress -->
    <div id="scroll-progress"></div>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
